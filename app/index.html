<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121417" />
    <title>Ramses</title>
    <link rel="stylesheet" href="assets/app.css" />
    <!--
      Order matters, and it is the opposite of what looks natural.

      Alpine's CDN build starts itself as soon as it executes, firing alpine:init
      once. Module scripts and deferred classic scripts run in document order, so
      loading Alpine first means it has already initialised by the time app.js
      attaches its alpine:init listener: no store, no components, and every
      x-data on the page throwing "not defined".

      app.js therefore has to come first.
    -->
    <script type="module" src="js/app.js"></script>
    <script defer src="assets/alpine.min.js"></script>
  </head>

  <body class="min-h-dvh bg-ram-bg font-sans text-ram-fg antialiased">
    <!--
      Every piece of text here picks one of the six roles defined in
      src/input.css: t-display, t-figure, t-label, t-body, t-meta, t-data,
      t-eyebrow. No ad-hoc sizes. Mono is for data only.
    -->
    <div
      x-data
      x-cloak
      class="mx-auto max-w-2xl px-5 pb-24 pt-[max(1.25rem,env(safe-area-inset-top))] md:max-w-4xl md:px-8 md:pt-10 lg:max-w-5xl"
    >
      <!-- Header. Present once signed in; the login screen carries its own. -->
      <header
        x-show="$store.ramses.user"
        class="mb-7 flex items-center justify-between border-b border-ram-line pb-4 md:mb-10"
      >
        <div>
          <p class="t-eyebrow text-ram-mid">Ramses</p>
          <p
            class="t-meta mt-1"
            x-text="$store.ramses.busy
              ? 'Refreshing...'
              : ($store.ramses.since ? 'Updated ' + $store.ramses.since : '')"
          ></p>
        </div>
        <div class="flex items-center gap-1">
          <button
            @click="$store.ramses.refresh()"
            :disabled="$store.ramses.busy"
            class="t-meta rounded-md px-3 py-2 hover:bg-ram-card hover:text-ram-fg focus-visible:outline-2 focus-visible:outline-ram-accent-lit disabled:opacity-40"
          >
            Refresh
          </button>
          <button
            @click="$store.ramses.logout()"
            class="t-meta rounded-md px-3 py-2 hover:bg-ram-card hover:text-ram-fg focus-visible:outline-2 focus-visible:outline-ram-accent-lit"
          >
            Sign out
          </button>
        </div>
      </header>

      <!-- Errors never replace the view underneath, only sit above it. -->
      <p
        x-show="$store.ramses.error"
        x-text="$store.ramses.error"
        class="t-body mb-5 rounded-md border border-ram-bad/40 bg-ram-bad/10 px-4 py-3 text-ram-bad"
      ></p>

      <!-- Sign in -->
      <section
        x-show="!$store.ramses.user"
        x-data="loginView"
        class="flex min-h-[70dvh] flex-col justify-center"
      >
        <div class="mb-10">
          <h1 class="t-display">Ramses</h1>
          <p class="t-body mt-3 text-ram-mid">
            Where everything stands, away from the desk.
          </p>
        </div>

        <form @submit.prevent="submit" class="max-w-md space-y-3">
          <label class="sr-only" for="email">Email</label>
          <input
            id="email"
            type="email"
            x-model="email"
            autocomplete="username"
            inputmode="email"
            placeholder="email"
            class="t-body w-full rounded-lg bg-ram-card px-4 py-3.5 outline-none ring-1 ring-ram-line placeholder:text-ram-dim focus:ring-ram-accent-lit"
          />
          <label class="sr-only" for="password">Password</label>
          <input
            id="password"
            type="password"
            x-model="password"
            autocomplete="current-password"
            placeholder="password"
            class="t-body w-full rounded-lg bg-ram-card px-4 py-3.5 outline-none ring-1 ring-ram-line placeholder:text-ram-dim focus:ring-ram-accent-lit"
          />
          <button
            type="submit"
            :disabled="!canSubmit"
            class="t-label w-full rounded-lg bg-ram-accent py-3.5 transition-opacity hover:opacity-90 disabled:opacity-40"
            x-text="$store.ramses.busy ? 'Signing in...' : 'Sign in'"
          ></button>
        </form>

        <p class="t-meta mt-8" x-text="host"></p>
      </section>

      <template x-if="$store.ramses.user">
        <div>
          <!-- Projects -->
          <section
            x-show="$store.ramses.route.view === 'projects'"
            x-data="projectsView"
            class="grid gap-3 md:gap-5"
            :class="projects.length > 1 ? 'md:grid-cols-2' : 'md:max-w-xl'"
          >
            <template x-for="(p, i) in projects" :key="p.uuid">
              <button
                @click="open(p)"
                class="rise block w-full rounded-xl bg-ram-card p-5 text-left ring-1 ring-ram-line transition-colors hover:ring-ram-accent-lit/40 focus-visible:outline-2 focus-visible:outline-ram-accent-lit md:p-7"
                :style="{ animationDelay: (i * 40) + 'ms' }"
              >
                <div class="flex items-end justify-between gap-4">
                  <span x-text="p.name" class="t-label"></span>
                  <span x-text="percent(p)" class="t-figure"></span>
                </div>
                <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-ram-line md:mt-6">
                  <div
                    class="h-full rounded-full bg-ram-accent-lit transition-[width] duration-500"
                    :style="{ width: (p.completion ?? 0) + '%' }"
                  ></div>
                </div>
              </button>
            </template>

            <p
              x-show="projects.length === 0 && !$store.ramses.busy"
              class="t-body py-16 text-center text-ram-dim"
            >
              No projects are assigned to you yet.
            </p>
          </section>

          <!-- One project -->
          <section
            x-show="$store.ramses.route.view === 'project'"
            x-data="projectView"
          >
            <template x-if="data">
              <div>
                <button
                  @click="back()"
                  class="t-meta hover:text-ram-fg focus-visible:outline-2 focus-visible:outline-ram-accent-lit"
                >
                  &larr; Projects
                </button>
                <h2 x-text="data.project.name" class="t-display mt-3"></h2>

                <!-- Scale, schedule and pulse. Three facts in one quiet line:
                     this app has no behind-schedule detection, so a passed
                     deadline reads as information, not as an alarm. -->
                <div class="t-meta mt-2 flex flex-wrap items-baseline gap-x-5 gap-y-1">
                  <span x-text="projectTally" class="tnum"></span>
                  <span x-show="deadline" x-text="deadline" class="tnum"></span>
                  <span x-show="lastChange" x-text="lastChange"></span>
                </div>

                <!-- The show strip: the whole project in one object, every shot
                     sized by its length. The only thing here weighted by
                     running time rather than by shot count, which is what the
                     schedule actually runs on. -->
                <div class="mt-7 md:mt-9">
                  <div class="strip">
                    <template x-for="group in strip" :key="group.uuid">
                      <div
                        class="strip-group"
                        :style="{ flexBasis: group.width + '%' }"
                        :aria-label="'Sequence ' + group.name"
                      >
                        <template x-for="s in group.segments" :key="s.uuid">
                          <button
                            @click="openShot(s.uuid)"
                            :title="s.title"
                            :aria-label="s.title"
                            :class="s.idle ? 'seg-idle' : ''"
                            :style="{ flexBasis: s.width + '%', backgroundColor: s.color }"
                            class="strip-seg"
                          ></button>
                        </template>
                      </div>
                    </template>
                  </div>
                  <p class="t-meta mt-2" x-text="stripCaption"></p>
                </div>

                <!-- Completion by step.
                     On a phone these stack and scroll away, so the compact row
                     below does the labelling. On a desktop they sit on the lane
                     grid, one per column, which makes them the column header. -->
                <div
                  class="mt-7 flex items-start gap-3 md:sticky md:top-0 md:z-10 md:-mx-8 md:mt-10 md:gap-4 md:border-b md:border-ram-line md:bg-ram-bg md:px-8 md:pb-4 md:pt-5"
                >
                  <span class="hidden shrink-0 md:block md:w-20"></span>
                  <div class="step-grid min-w-0 flex-1" :style="{ '--lane-cols': laneCols }">
                    <template x-for="step in steps" :key="step.uuid">
                      <div>
                        <div class="flex items-baseline justify-between gap-2">
                          <span x-text="step.shortName" class="t-label"></span>
                          <span
                            x-text="stepPercent(step.uuid)"
                            class="t-data text-ram-mid"
                          ></span>
                        </div>
                        <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-ram-line">
                          <div
                            class="h-full rounded-full transition-[width] duration-500"
                            :style="{ width: stepWidth(step.uuid), backgroundColor: step.color || '#7fa3d8' }"
                          ></div>
                        </div>

                        <!-- What is left, not just how much. A percentage cannot
                             say whether the remainder is thirty untouched shots
                             or two in review. -->
                        <p class="mt-2 hidden md:block">
                          <template x-for="(t, i) in tallyFor(step.uuid)" :key="t.name">
                            <span class="t-data whitespace-nowrap">
                              <span x-show="i > 0" class="text-ram-line">/</span>
                              <span
                                x-text="t.count + ' ' + t.name"
                                :style="{ color: t.color }"
                              ></span>
                            </span>
                          </template>
                        </p>
                      </div>
                    </template>
                  </div>
                  <span class="t-eyebrow hidden shrink-0 text-right md:block md:w-16">
                    Frames
                  </span>
                </div>

                <!-- Phone only. On a desktop the summary bars above are already
                     one per column and carry these same names. -->
                <div
                  class="sticky top-0 z-10 -mx-5 mt-7 border-b border-ram-line bg-ram-bg px-5 pb-2 pt-3 md:hidden"
                >
                  <div class="flex items-center gap-3">
                    <span class="w-16 shrink-0"></span>
                    <div class="lane flex-1" :style="laneStyle">
                      <template x-for="step in steps" :key="step.uuid">
                        <span
                          x-text="step.shortName"
                          class="t-eyebrow truncate text-center"
                        ></span>
                      </template>
                    </div>
                    <span class="t-eyebrow w-12 shrink-0 text-right">Fr</span>
                  </div>
                </div>

                <!-- Shots, by sequence -->
                <template x-for="seq in sequences" :key="seq.uuid">
                  <div class="mt-8 md:mt-10">
                    <h3 class="mb-3 flex items-baseline gap-4">
                      <span x-text="label(seq)" class="t-label text-ram-mid"></span>
                      <span class="h-px flex-1 bg-ram-line"></span>
                      <span x-text="tally(seq.shots, seq.uuid)" class="t-meta tnum"></span>
                    </h3>

                    <div class="space-y-1.5 md:space-y-2">
                      <template x-for="(shot, i) in seq.shots" :key="shot.uuid">
                        <button
                          @click="open(shot)"
                          class="rise flex w-full items-center gap-3 rounded-md py-0.5 text-left focus-visible:outline-2 focus-visible:outline-ram-accent-lit md:gap-4"
                          :style="{ animationDelay: Math.min(i * 18, 360) + 'ms' }"
                        >
                          <span
                            x-text="label(shot)"
                            class="t-data w-16 shrink-0 md:w-20"
                          ></span>
                          <div class="lane h-8 flex-1 md:h-11" :style="laneStyle">
                            <template x-for="step in steps" :key="step.uuid">
                              <span
                                class="t-data flex items-center justify-center truncate"
                                :class="segment(shot.uuid, step.uuid).idle ? 'seg-idle' : ''"
                                :style="segment(shot.uuid, step.uuid).style"
                                x-text="segment(shot.uuid, step.uuid).label"
                              ></span>
                            </template>
                          </div>
                          <span
                            x-text="framesText(shot)"
                            class="t-data w-12 shrink-0 text-right text-ram-dim md:w-16"
                          ></span>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </section>

          <!-- One shot -->
          <section x-show="$store.ramses.route.view === 'shot'" x-data="shotView">
            <template x-if="shot">
              <div>
                <button
                  @click="back()"
                  class="t-meta hover:text-ram-fg focus-visible:outline-2 focus-visible:outline-ram-accent-lit"
                >
                  &larr; Back
                </button>

                <h2 class="t-display mt-3 font-mono tnum" x-text="label(shot)"></h2>
                <p class="t-meta mt-2">
                  <span x-text="sequence ? label(sequence) : ''"></span>
                  <span
                    x-show="shot.duration"
                    x-text="' / ' + frames + ' frames / ' + Number(shot.duration).toFixed(2) + ' s / ' + fps + ' fps'"
                    class="tnum"
                  ></span>
                </p>

                <div class="mt-7 space-y-2 md:mt-10 md:space-y-3">
                  <template x-for="(row, i) in rows" :key="row.step.uuid">
                    <div
                      class="rise rounded-xl bg-ram-card p-4 ring-1 ring-ram-line md:p-6"
                      :style="{ animationDelay: (i * 40) + 'ms' }"
                    >
                      <div class="flex items-center justify-between gap-4">
                        <span x-text="row.step.shortName" class="t-label"></span>
                        <span
                          class="t-data rounded px-2.5 py-1"
                          :class="row.state ? '' : 'text-ram-dim ring-1 ring-ram-line'"
                          :style="row.state ? row.swatch : {}"
                          x-text="row.stateName || 'nothing to do'"
                        ></span>
                      </div>
                      <p
                        x-show="row.comment"
                        x-text="row.comment"
                        class="t-body mt-3 text-ram-mid"
                      ></p>
                      <p x-show="row.modified" x-text="row.modified" class="t-meta mt-2"></p>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </section>
        </div>
      </template>

      <!-- Busy indicator. Deliberately a hairline: the views keep their content
           while refreshing, so this must not imply the screen is empty. -->
      <div
        x-show="$store.ramses.busy"
        class="fixed inset-x-0 top-0 h-0.5 animate-pulse bg-ram-accent-lit"
      ></div>
    </div>
  </body>
</html>
